# All environment-specific values come from environment variables (12-factor).
# Defaults point at identity-service running on the host (port 8081).
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys come from identity-service's JWKS (fetched once, cached, refetched on an unknown kid).
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          # With jwk-set-uri set, this is only checked against the iss claim: no discovery request.
          issuer-uri: ${JWT_ISSUER:http://identity-service}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Brute-force protection: token buckets in Redis, one per client IP (ADR 0007).
            # 60 tokens, refilled at 1/s. Login costs 6 (10 per minute), register costs 12 (5 per minute).
            # Over the limit: 429 with X-RateLimit-* headers. order -1 = matched before the general route.
            - id: identity-login
              uri: ${IDENTITY_URI:http://localhost:8081}
              order: -1
              predicates:
                - Path=/auth/login
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 60
                    redis-rate-limiter.requestedTokens: 6
                # Refresh token: JSON body <-> HttpOnly cookie (ADR 0008).
                - RefreshTokenCookie
            - id: identity-register
              uri: ${IDENTITY_URI:http://localhost:8081}
              order: -1
              predicates:
                - Path=/auth/register
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 60
                    redis-rate-limiter.requestedTokens: 12
            - id: identity-session
              uri: ${IDENTITY_URI:http://localhost:8081}
              order: -1
              predicates:
                - Path=/auth/refresh,/auth/switch-org
              filters:
                - RefreshTokenCookie
            - id: identity-logout
              uri: ${IDENTITY_URI:http://localhost:8081}
              order: -1
              predicates:
                - Path=/auth/logout
              filters:
                - name: RefreshTokenCookie
                  args:
                    endSession: true
            # Paths stay as identity-service defines them (ADR 0006). The Authorization header is
            # forwarded as is, so identity-service validates the token again (defense in depth).
            - id: identity
              uri: ${IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/auth/**,/me,/orgs,/orgs/**

server:
  port: ${PORT:8080}

gateway:
  rate-limit:
    # Proxies in front of the gateway that append to X-Forwarded-For. 0 = clients connect directly
    # (compose). Behind one ingress proxy (Kubernetes): 1. Never trust more hops than really exist,
    # or clients can pick their own rate-limit key by sending a fake X-Forwarded-For.
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:0}
  refresh-cookie:
    name: refresh_token
    secure: ${REFRESH_COOKIE_SECURE:true}
    # Same as identity-service's REFRESH_TOKEN_TTL.
    max-age: ${REFRESH_COOKIE_MAX_AGE:7d}
  cors:
    # Comma-separated. The Vite dev server locally; the real web origin in Kubernetes.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  metrics:
    distribution:
      # A few fixed latency buckets, so Prometheus can compute percentiles (p95) per route with
      # histogram_quantile(). Far fewer series than a full histogram. The brackets keep the dotted meter name one key.
      slo:
        "[http.server.requests]": 25ms,50ms,100ms,250ms,500ms,1s,2s
  endpoints:
    web:
      # Same layout as the services: /health, /ready, /metrics at the root.
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
        health: actuator/health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: "server:/health"
        # Neither downstream services nor Redis are part of readiness: one slow service must not take the
        # whole edge out, and without Redis the rate limiter lets requests through (fails open).
        readiness:
          include: readinessState
          additional-path: "server:/ready"
