# All environment-specific values come from environment variables (12-factor).
# Defaults point at the local compose stack (postgres on host port 5433).
spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/identity}
    username: ${DB_USER:identity}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    # Errors as RFC 9457 problem+json (validation, 401, 409, ...).
    problemdetails:
      enabled: true
  kafka:
    # Compose: kafka:9092. Default = the host listener of the compose broker.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      # Keys and values are Strings: events are serialized to JSON by us (no Java type headers).
      # acks=all + idempotence are the Kafka client defaults.
      buffer-memory: 4MB
      properties:
        # Sends run on the outbox relay's scheduler thread inside a DB transaction (ADR 0014), so fail fast
        # and let the relay retry: send() waits at most max.block.ms for broker metadata, and a record gives
        # up after delivery.timeout.ms (15 s, default 120 s) instead of piling up behind a dead broker.
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:10000}
        request.timeout.ms: 10000
        delivery.timeout.ms: 15000

server:
  port: ${PORT:8081}

identity:
  jwt:
    # PKCS#8 PEM RSA key. Local: scripts/gen-jwt-key.sh. Kubernetes: mounted Secret. Startup fails without it.
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    # Must be a URL (Spring Security parses iss as one). The service's DNS name in compose and Kubernetes.
    issuer: ${JWT_ISSUER:http://identity-service}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:7d}
  events:
    # Topics are declared at startup (auto-create is off in the broker). 1 locally: single broker.
    replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
    outbox:
      # Max delay between commit and send while healthy. Backs off to max-backoff while Kafka is down.
      poll-interval: ${OUTBOX_POLL_INTERVAL:500ms}
      # Safety net above delivery.timeout.ms: normally the producer reports the failure first.
      send-timeout: 20s
      retention: ${OUTBOX_RETENTION:7d}

springdoc:
  # Spec at /v3/api-docs(.yaml); exported to contracts/openapi/identity.yaml by OpenApiContractTests.
  default-produces-media-type: application/json
  api-docs:
    # Public on purpose: it's the contract. Set API_DOCS_ENABLED=false to hide it.
    enabled: ${API_DOCS_ENABLED:true}
  # Stable key order, so the exported file only changes when the API does.
  writer-with-order-by-keys: true

management:
  metrics:
    distribution:
      # A few fixed latency buckets, so Prometheus can compute percentiles (p95) per route with
      # histogram_quantile(). Far fewer series than a full histogram. The brackets keep the dotted meter name one key.
      slo:
        "[http.server.requests]": 25ms,50ms,100ms,250ms,500ms,1s,2s
  endpoints:
    web:
      # Actuator lives at the root so Prometheus can scrape /metrics.
      # Full health stays reachable at /actuator/health for debugging.
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
        health: actuator/health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Liveness: "is the process stuck?" Never include the DB, or a DB outage restarts every pod.
        liveness:
          include: livenessState
          additional-path: "server:/health"
        # Readiness: "can it serve traffic now?" Includes the DB, so K8s stops routing to it when the DB is down.
        readiness:
          include: readinessState,db
          additional-path: "server:/ready"
