# All environment-specific values come from environment variables (12-factor).
# Defaults point at the local compose stack (postgres on host port 5433).
spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/identity}
    username: ${DB_USER:identity}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    # Errors as RFC 9457 problem+json (validation, 401, 409, ...).
    problemdetails:
      enabled: true

server:
  port: ${PORT:8081}

identity:
  jwt:
    # PKCS#8 PEM RSA key. Local: scripts/gen-jwt-key.sh. Kubernetes: mounted Secret. Startup fails without it.
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    # Must be a URL (Spring Security parses iss as one). The service's DNS name in compose and Kubernetes.
    issuer: ${JWT_ISSUER:http://identity-service}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:7d}

springdoc:
  # Spec at /v3/api-docs(.yaml); exported to contracts/openapi/identity.yaml by OpenApiContractTests.
  default-produces-media-type: application/json
  api-docs:
    # Public on purpose: it's the contract. Set API_DOCS_ENABLED=false to hide it.
    enabled: ${API_DOCS_ENABLED:true}
  # Stable key order, so the exported file only changes when the API does.
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      # Actuator lives at the root so Prometheus can scrape /metrics.
      # Full health stays reachable at /actuator/health for debugging.
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
        health: actuator/health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Liveness: "is the process stuck?" Never include the DB, or a DB outage restarts every pod.
        liveness:
          include: livenessState
          additional-path: "server:/health"
        # Readiness: "can it serve traffic now?" Includes the DB, so K8s stops routing to it when the DB is down.
        readiness:
          include: readinessState,db
          additional-path: "server:/ready"
