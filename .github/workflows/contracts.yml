# The contracts themselves: event schemas compile and accept/reject their examples; the OpenAPI spec lints.
# (Whether a service still matches its contract is checked by that service's own tests.)
name: contracts

on:
  push:
    branches: [main]
    paths: &paths
      - contracts/**
      - scripts/check-event-schemas.sh
      - .github/workflows/contracts.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Event schemas
        run: ./scripts/check-event-schemas.sh
      - name: Lint OpenAPI
        run: npx -y @redocly/cli@2.58.2 lint contracts/openapi/*.yaml
