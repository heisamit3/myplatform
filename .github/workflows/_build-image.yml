# Reusable: build a service's Docker image; on main, push it to GHCR tagged with the commit SHA.
# Called by the per-service workflows after their tests pass (ADR 0015).
# Pull requests only build (proves the Dockerfile still works) and never push.
name: build-image

on:
  workflow_call:
    inputs:
      service:
        description: Image name; also the directory under services/ unless context is set
        type: string
        required: true
      context:
        description: Build context (default services/<service>)
        type: string
        default: ""

permissions: {}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # The github context is the caller's: a push to main publishes, anything else only builds.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/<owner>/myplatform/<service>:<full commit SHA>. Immutable tags only, no :latest:
      # Argo CD (Phase 6) deploys an exact SHA, so every running pod maps to one commit.
      # Also sets the OCI labels (source repo, revision, created), which links the package to the repo.
      - name: Image name, tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.service }}
          tags: type=sha,format=long,prefix=

      - name: Build${{ env.PUSH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context || format('services/{0}', inputs.service) }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Services that show their version use it (web footer); the others ignore it.
          build-args: GIT_SHA=${{ github.sha }}
          # Layer cache in the GitHub Actions cache, one scope per service so they don't evict each other.
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Summary
        if: env.PUSH == 'true'
        run: |
          echo "Pushed: $TAGS" >> "$GITHUB_STEP_SUMMARY"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

  # GitOps (ADR 0019): record the new image in Git; Argo CD notices the commit and deploys it.
  # CI never talks to a cluster. Pushes made with GITHUB_TOKEN don't start new workflow runs ([skip ci] is a
  # second guard). Gotcha: GitHub skips a push whose message contains that marker anywhere, even in prose,
  # so human commit messages must not quote it.
  bump-tag:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      SERVICE: ${{ inputs.service }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history for the "is this commit newer?" check below.
          fetch-depth: 0

      - name: Write ${{ inputs.service }}:${{ github.sha }} to values-image.yaml
        run: |
          file="infra/helm/services/$SERVICE/values-image.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other services' runs push to main at the same time: on a rejected push, re-read main and retry.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            current="$(sed -n 's/^  tag: //p' "$file")"
            if [ "$current" = "$SHA" ]; then echo "already at $SHA"; exit 0; fi
            # A slower, older run must not roll back a newer image that already went out.
            if git merge-base --is-ancestor "$SHA" "$current" 2>/dev/null; then
              echo "main already deploys $current, which is newer than $SHA"; exit 0
            fi
            sed -i "s/^  tag: .*/  tag: $SHA/" "$file"
            git commit -q -am "ci(deploy): $SERVICE ${SHA:0:7} [skip ci]"
            if git push -q origin HEAD:main; then echo "deployed tag $SHA" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            sleep $((attempt * 3))
          done
          echo "could not push after 5 attempts" >&2; exit 1
