name: api-gateway

on:
  push:
    branches: [main]
    paths: &paths
      - services/api-gateway/**
      - .github/workflows/api-gateway.yml
      - .github/workflows/_build-image.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions: {}

# A newer commit on the same PR cancels the older run; runs on main always finish (each SHA gets an image).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      # Caches Gradle and its dependencies; also verifies gradle-wrapper.jar against known checksums.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # Unit + Testcontainers integration tests (Redis): the runner has Docker.
      - run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-gateway-test-reports
          path: services/api-gateway/build/reports/tests/
          retention-days: 7

  image:
    needs: test
    permissions:
      contents: write # bump-tag job commits the new image tag (ADR 0019)
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      service: api-gateway
