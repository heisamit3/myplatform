name: web

on:
  push:
    branches: [main]
    paths: &paths
      - web/**
      - .github/workflows/web.yml
      - .github/workflows/_build-image.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions: {}

# A newer commit on the same PR cancels the older run; runs on main always finish (each SHA gets an image).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # nginx image with the built app (web/Dockerfile), same-origin API (ADR 0017).
  image:
    needs: check
    permissions:
      contents: write # bump-tag job commits the new image tag (ADR 0019)
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      service: web
      context: web
