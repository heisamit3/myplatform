name: notification-service

on:
  push:
    branches: [main]
    paths: &paths
      - services/notification-service/**
      # A unit test parses the committed event example.
      - contracts/events/**
      - .github/workflows/notification-service.yml
      - .github/workflows/_build-image.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions: {}

# A newer commit on the same PR cancels the older run; runs on main always finish (each SHA gets an image).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/notification-service/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # Unit + Testcontainers integration tests (Kafka, MongoDB, Mailpit): the runner has Docker.
      - run: npm test
      - run: npm run build

  image:
    needs: test
    permissions:
      contents: write # bump-tag job commits the new image tag (ADR 0019)
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      service: notification-service
