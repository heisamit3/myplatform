# identity-service, hand-written (learning phase; replaced by the shared Helm chart later in Phase 5).
# Needs (created by scripts/k8s-local-secrets.sh, never committed): Secret identity-db {password},
# Secret identity-jwt {private.pem}. Image loaded with ./scripts/minikube-load.sh.

# ConfigMap: non-secret settings, injected as environment variables (12-factor, same names as compose).
apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-service
  namespace: myplatform
  labels:
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/part-of: myplatform
data:
  # "postgres" resolves through the headless Service in the same namespace.
  DB_URL: jdbc:postgresql://postgres:5432/identity
  DB_USER: identity
  JWT_PRIVATE_KEY_PATH: /etc/identity/jwt/private.pem
  # Kafka isn't in the cluster yet: registration still works, events wait in the outbox (ADR 0014).
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
---
# Service: a stable virtual IP + DNS name ("identity-service") in front of whichever pods match the selector.
# ClusterIP = reachable only inside the cluster; clients will come through the gateway.
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: myplatform
  labels:
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/part-of: myplatform
spec:
  selector:
    app.kubernetes.io/name: identity-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
# Deployment: keeps N identical pods running and replaces them gradually on an image/config change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: myplatform
  labels:
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/part-of: myplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
        app.kubernetes.io/part-of: myplatform
    spec:
      securityContext:
        # The image's numeric user (Dockerfile: UID 10001). runAsNonRoot refuses to start a root container.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Mounted Secret files get this group, so the app user can read the 0440 key file.
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: identity-service
          image: myplatform/identity-service:local
          # Never pull: the image only exists inside minikube (loaded from the local build).
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: identity-service
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: identity-db, key: password }
          ports:
            - name: http
              containerPort: 8081
          # Memory request = limit (384Mi, heap = 40% via the image's JAVA_TOOL_OPTIONS, ADR 0005).
          # No CPU limit: throttling makes JVM startup very slow; the request still reserves a share.
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 384Mi }
          # Startup probe: holds off the other two probes until the app answered once (JVM start can take ~1 min
          # on 2 CPUs). Allows up to 5 s x 36 = 3 min.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 36
          # Liveness: process only, no DB. A DB outage must not restart every pod.
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: includes the DB. When it fails, the pod is taken out of the Service (no traffic), not restarted.
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: jwt
              mountPath: /etc/identity/jwt
              readOnly: true
            # Writable /tmp (embedded Tomcat's work dir) on an otherwise read-only filesystem.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: jwt
          secret:
            secretName: identity-jwt
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
