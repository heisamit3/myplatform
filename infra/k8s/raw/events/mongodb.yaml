# MongoDB for notification-service, same image, cache cap and init script as compose.
# Needs (created by scripts/k8s-local-secrets.sh, never committed):
#   Secret mongo-root {password}, Secret notification-db {password, uri}, ConfigMap mongo-init.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: myplatform
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: myplatform
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: myplatform
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: myplatform
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/part-of: myplatform
    spec:
      # The image's mongodb user. Started as non-root, the entrypoint skips its chown step, so fsGroup
      # has to make the volume writable instead.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mongodb
          image: mongo:8.0.32
          # Caps the WiredTiger cache (default ~50% of the node's RAM, not the container's) to fit 384Mi.
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mongo-root, key: password }
            # Read by the init script (one database + user per service).
            - name: NOTIFICATION_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: notification-db, key: password }
          ports:
            - name: mongodb
              containerPort: 27017
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 384Mi }
          # TCP checks: mongosh is a ~60 MB Node process. During first-start init the entrypoint runs a
          # temporary mongod on localhost only, so the pod IP answers only once the real server is up.
          startupProbe:
            tcpSocket: { port: mongodb }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket: { port: mongodb }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: mongodb }
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: data
              mountPath: /data/db
            # Runs only when /data/db holds no database yet, like in compose.
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: mongo-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
