# Gateway API CRDs (Gateway, HTTPRoute, ...) straight from the upstream repo, same version as
# scripts/k8s-local-platform.sh. Kubernetes doesn't ship them and the Traefik chart doesn't include them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.1
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false     # never delete CRDs automatically: that would delete every Gateway/HTTPRoute with them
      selfHeal: true
    syncOptions:
      # The CRDs are too big for client-side apply's last-applied annotation (256 KiB limit).
      - ServerSideApply=true
