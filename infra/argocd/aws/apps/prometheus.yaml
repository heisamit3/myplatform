# Prometheus server only (scrapes annotated pods + cAdvisor). Chart 29.35.0 = Prometheus v3.15.0.
# Upstream chart + our values file (multi-source), same version and values as minikube (ADR 0018, 0022).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.35.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/infra/helm/platform/prometheus-values.yaml
    - repoURL: https://github.com/heisamit3/myplatform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
