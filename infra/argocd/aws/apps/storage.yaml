# The default gp3 StorageClass (infra/k8s/aws/). Must exist before any PVC is created (wave -2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    repoURL: https://github.com/heisamit3/myplatform.git
    targetRevision: main
    path: infra/k8s/aws
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
