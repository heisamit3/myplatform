# Grafana with the Prometheus datasource and our dashboards provisioned from files. Chart 13.2.7 = Grafana 13.2.3.
# Upstream chart + our values file (multi-source), same version and values as minikube (ADR 0018, 0022).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 13.2.7
      helm:
        releaseName: grafana
        valueFiles:
          - $values/infra/helm/platform/grafana-values.yaml
    - repoURL: https://github.com/heisamit3/myplatform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
