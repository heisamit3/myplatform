# ConfigMap grafana-dashboards, generated by kustomize from the JSON files in infra/helm/platform/dashboards/.
# Same source minikube uses (kubectl apply -k). Wave -3: there before Grafana mounts it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-dashboards
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/heisamit3/myplatform.git
    targetRevision: main
    path: infra/helm/platform/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
