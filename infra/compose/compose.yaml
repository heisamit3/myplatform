# Local dev stack. Start only what you need with profiles:
#   docker compose -f infra/compose/compose.yaml --profile core up -d      # postgres, redis, identity-service, api-gateway
#   docker compose -f infra/compose/compose.yaml --profile core --profile events up -d
# Every container has an explicit memory limit (8 GB host, see CLAUDE.md "Resource limits").
# Ports bind to 127.0.0.1 only, so nothing is exposed to the LAN.

name: myplatform

services:
  postgres:
    # pgvector image = official Postgres + the vector extension (needed later by ai-service).
    image: pgvector/pgvector:0.8.7-pg18-trixie
    profiles: [core]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/.env}
      # Read by postgres/init/01-service-databases.sh (one DB + role per service).
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in infra/compose/.env}
    # Small buffers so Postgres fits in 256M.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50", "-c", "work_mem=2MB"]
    ports:
      # Host 5433 by default: a native Windows PostgreSQL service already uses 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - pgdata:/var/lib/postgresql
      # Init scripts run only on first start with an empty volume.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine
    profiles: [core]
    # Cache, rate limits and token revocation. No persistence locally.
    # noeviction: when full, writes fail loudly instead of silently dropping revoked-token entries.
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  identity-service:
    build:
      context: ../../services/identity-service
    image: myplatform/identity-service:local
    profiles: [core]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/identity
      DB_USER: identity
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in infra/compose/.env}
      # Mounted from the secret below. Create it once with ./scripts/gen-jwt-key.sh.
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private-key
      # Only reachable with the events profile. Without it, registration still works; events are logged as lost.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    secrets:
      - jwt-private-key
    # No host port: clients go through api-gateway on 8080. The gateway reaches identity-service:8081
    # on the compose network. Debug directly with:
    #   docker compose -f infra/compose/compose.yaml exec identity-service wget -qO- http://127.0.0.1:8081/health
    depends_on:
      postgres:
        condition: service_healthy
      # Optional: with the events profile, wait for Kafka so the topic is created at startup.
      kafka:
        condition: service_healthy
        required: false
    # The image sets -XX:MaxRAMPercentage=40 (ADR 0005): heap cap ~154 MiB of this limit.
    mem_limit: 384m
    healthcheck:
      # /ready includes the database (busybox wget is in the alpine image; there is no curl).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/ready"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  api-gateway:
    build:
      context: ../../services/api-gateway
    image: myplatform/api-gateway:local
    profiles: [core]
    environment:
      IDENTITY_URI: http://identity-service:8081
      JWKS_URI: http://identity-service:8081/.well-known/jwks.json
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Rate-limit buckets for login/register.
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      # Not strictly needed (keys are fetched on the first token), but avoids 5xx right after `up`.
      identity-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Same JVM setting as identity-service (ADR 0005).
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  mailpit:
    # Fake SMTP server with a web UI and REST API. notification-service sends email here.
    image: axllent/mailpit:v1.31.4
    profiles: [events]
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      # SMTP on host 2525: Windows refuses to bind 1025 here. Containers use mailpit:1025.
      - "127.0.0.1:2525:1025"
      - "127.0.0.1:8025:8025" # web UI + API
    mem_limit: 64m
    restart: unless-stopped

  kafka:
    # Official Apache image. KRaft mode: this one node is both broker and controller (no ZooKeeper).
    image: apache/kafka:4.3.1
    profiles: [events]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Fixed ID (base64 of "myplatform-local") so the data volume survives `down`/`up`.
      CLUSTER_ID: bXlwbGF0Zm9ybS1sb2NhbA
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT = containers (kafka:9092), EXTERNAL = host tools (localhost:9094), CONTROLLER = KRaft quorum.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker: internal topics can't have more than one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared by the producing service, so a typo in a consumer can't create one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    mem_limit: 768m
    healthcheck:
      # A port check, not kafka-broker-api-versions.sh: that starts a second JVM inside this 768M limit.
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  mongodb:
    image: mongo:8.0.32
    profiles: [events]
    # Caps the WiredTiger cache (default is ~50% of RAM) so mongod fits in 384M.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in infra/compose/.env}
      # Read by mongo/init/01-service-users.js (one database + user per service).
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in infra/compose/.env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
      # Init scripts run only on first start with an empty volume.
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 384m
    healthcheck:
      # mongosh is a Node process (~60 MB), so check less often than the other services.
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  mongodata:

secrets:
  jwt-private-key:
    # Gitignored. Compose bind-mounts it read-only at /run/secrets/jwt-private-key.
    file: ./secrets/jwt-private.pem
