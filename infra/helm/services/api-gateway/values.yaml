# api-gateway: settings shared by every environment. Environment specifics: values-<env>.yaml.
# No HTTPRoute of its own besides the API paths: /health, /ready and /metrics stay inside the cluster.
port: 8080

env:
  IDENTITY_URI: http://identity-service:8081
  JWKS_URI: http://identity-service:8081/.well-known/jwks.json
  REDIS_HOST: redis
  # Exactly one proxy (Traefik) in front of the gateway appends to X-Forwarded-For (ADR 0007).
  RATE_LIMIT_TRUSTED_PROXIES: "1"

resources:
  requests: { cpu: 250m, memory: 384Mi }
  limits: { memory: 384Mi }

# Same origin as the web app (ADR 0017): Traefik sends the API paths here and everything else to web.
route:
  enabled: true
  paths:
    - { type: PathPrefix, value: /auth }
    - { type: Exact, value: /me }
    - { type: PathPrefix, value: /orgs }
