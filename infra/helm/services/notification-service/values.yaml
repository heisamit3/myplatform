# notification-service: settings shared by every environment. Environment specifics: values-<env>.yaml.
# Needs Kafka, MongoDB and an SMTP server in the cluster (infra/k8s/raw/events/, ADR 0021). Not in the default
# minikube set or the local Argo CD apps (RAM); deployed by hand in an events session (see CLAUDE.md).
# Needs Secret notification-db {uri} (mongodb://notification:<password>@mongodb:27017/notification).
port: 8082

env:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"

secretEnv:
  MONGODB_URI: { secret: notification-db, key: uri }

# The image caps the V8 heap at 96 MB; librdkafka's buffers live outside it (ADR 0012).
resources:
  requests: { cpu: 100m, memory: 192Mi }
  limits: { memory: 192Mi }

# Node starts in seconds: a shorter startup window than the JVM default.
probes:
  startup: { path: /health, periodSeconds: 2, failureThreshold: 30 }
  liveness: { path: /health, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
  readiness: { path: /ready, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
