{{- if .Values.route.enabled }}
{{- if not .Values.route.paths }}{{ fail "route.paths must not be empty when route.enabled" }}{{ end }}
# Gateway API: attaches to the shared Gateway and sends matching paths to this service's Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway }}
  rules:
    - matches:
        {{- range .Values.route.paths }}
        - path:
            type: {{ .type }}
            value: {{ .value }}
        {{- end }}
      backendRefs:
        - name: {{ include "service.name" . }}
          port: {{ .Values.port }}
{{- end }}
