# Serves the built single-page app. Runs in nginxinc/nginx-unprivileged (port 8080, UID 101, temp files in /tmp).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Probes (liveness/readiness): nginx itself answers, no files involved.
    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /ready  { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Vite puts a content hash in every asset file name, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Client-side routes (/login, /profile, ...) all load index.html; never cache it, so a deploy shows up at once.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri /index.html;
    }
}
